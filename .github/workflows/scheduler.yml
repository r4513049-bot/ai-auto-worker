name: AI Cloud Worker

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-ai-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run automation script
        run: python main.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "AI Worker Bot"
          git config --global user.email "bot@ci.local"
          git add index.html
          git commit -m "Auto-update index.html via cloud worker [skip ci]" || exit 0
          git push
